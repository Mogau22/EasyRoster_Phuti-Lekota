<div class="app-shell">

  <header class="app-header">
    <div>
      <h1>EasyRoster</h1>
      <p>Customer Management</p>
    </div>
  </header>

  <main class="app-content">

    @if (showForm) {

      <app-customer-form
        [customer]="selectedCustomer"
        (saved)="customerSaved()"
        (cancelled)="cancelForm()">
      </app-customer-form>

    } @else {

      <app-customer-list
        [refreshKey]="refreshKey"
        (create)="createCustomer()"
        (edit)="editCustomer($event)">
      </app-customer-list>

    }

  </main>

</div>
